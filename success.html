<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order status</title><style>body{background:#111820;color:#e8edf5;font:18px/1.6 system-ui;margin:0}main{max-width:640px;margin:10vh auto;padding:24px}a{color:#f5a623}</style></head><body><main><h1>Your RegoMate order</h1><p id="order-status" role="status">Checking your checkout status…</p><p><a href="/account">Open your account</a> · <a href="/">Return home</a></p></main><script>
async function checkOrder(){const el=document.getElementById('order-status');const id=new URLSearchParams(location.search).get('session_id');if(!id){el.textContent='No checkout session was supplied. Sign in to your account to check your order.';return;}try{const response=await fetch(RM_CONFIG.apiUrl+'/checkout/status?session_id='+encodeURIComponent(id));const data=await response.json();if(!response.ok)throw new Error(data.error);el.textContent=data.status==='fulfilled'?'Payment confirmed. Your print request has been accepted. Allow 3–5 business days for dispatch.':data.status==='paid'?'Payment confirmed. Your sticker order is queued for fulfillment.':data.status==='needs_review'?'Your order needs a support review. Check your Stripe receipt and contact support before placing another order.':data.status==='expired'?'This checkout expired without a confirmed payment. Return home to start a new order.':'Your order is still being confirmed. Check again shortly; this page does not confirm payment by itself.';}catch{el.textContent='We could not verify this order yet. Check your Stripe receipt and sign in to your account, or contact support.';}}
checkOrder();
</script></body></html>
